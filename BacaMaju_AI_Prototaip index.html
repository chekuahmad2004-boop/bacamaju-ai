<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BacaMaju AI | Modul Membaca Bahasa Melayu</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#17354a;background:#f1f6fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:930px;margin:auto;padding:20px}.head{background:#123c59;color:white;padding:22px 25px;border-radius:19px;display:flex;justify-content:space-between;align-items:center;gap:10px}.head h1{margin:0;font-size:1.65rem}.head p{margin:5px 0 0;color:#d5e6f1}.pill{background:#d9f5e7;color:#174e37;padding:7px 12px;border-radius:30px;font-weight:700;font-size:.8rem}.panel{background:white;border:1px solid #dbe6ee;border-radius:18px;padding:24px;margin-top:17px;box-shadow:0 4px 18px #1d4b6b0c}h2{margin-top:0}h3{margin-bottom:8px}p{line-height:1.65}.muted{color:#557083}.small{font-size:.88rem}.flex{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#eff6fa;border-radius:12px;padding:14px;flex:1;min-width:135px}.stat strong{display:block;font-size:1.3rem}.btn{background:#0d6689;color:white;border:0;border-radius:12px;padding:12px 17px;font-size:1rem;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(.94)}.btn:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e8f0f5;color:#20485d}.danger{background:#fff0ee;color:#a12f27}.ghost{background:transparent;color:#185879;border:1px solid #c3d8e4}.choices{display:grid;gap:10px;margin:18px 0}.choice{padding:15px;border:2px solid #d7e4ec;background:white;text-align:left;border-radius:12px;font-size:1.05rem;cursor:pointer;color:#1c4259}.choice.selected{border-color:#08799b;background:#eaf9ff}.progress{height:10px;background:#e3edf2;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#199c88;transition:width .2s}.prompt{background:#eff7fc;border-radius:15px;padding:23px;margin-top:15px;text-align:center}.word{font-size:2rem;font-weight:800;letter-spacing:.025em}.passage{font-size:1.3rem;line-height:1.9;text-align:left}.notice{border-left:4px solid #e3a62c;padding:12px 15px;background:#fff8e6;border-radius:8px}.success{background:#e6f7ed;border-left:4px solid #2c9962;padding:13px;border-radius:9px}.error{background:#fff1eb;border-left:4px solid #d9794c;padding:13px;border-radius:9px}.nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}label{font-weight:600;display:block;margin:12px 0 6px}input{font:inherit;border:1px solid #c7dbe6;border-radius:10px;padding:12px;width:100%;max-width:380px}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:10px;border-bottom:1px solid #e3edf2;text-align:left}th{background:#f1f7fb}.tablewrap{overflow:auto}.footer{margin:20px 0;color:#667e8e;font-size:.83rem}.hidden{display:none}@media(max-width:500px){.shell{padding:10px}.panel{padding:17px}.head{padding:17px}.head h1{font-size:1.35rem}.word{font-size:1.6rem}}
</style></head><body><main class="shell"><header class="head"><div><h1>📘 BacaMaju AI</h1><p>Modul Digital Adaptif Membaca Bahasa Melayu</p></div><span class="pill">Prototaip v1.0</span></header><section id="app" aria-live="polite"></section><footer class="footer">Prototaip pendidikan • Semua latihan dalam bahasa Melayu • Berfungsi tanpa internet • Tiada data dihantar ke pelayan. Penyesuaian aras menggunakan peraturan markah, bukan model AI masa nyata.</footer></main><script>
'use strict';
// Bahan latihan bahasa Melayu disediakan dengan bantuan AI dan semakan penyuntingan manusia.
// Jawapan dalam modul ini mengukur pemahaman/pengecaman teks, bukan ketepatan sebutan lisan.
const bank={
  1:[
   {q:'Pilih gabungan suku kata yang membentuk perkataan BUKU.',options:['BA + KU','BU + KU','BO + KU'],a:1,why:'BU + KU membentuk perkataan buku.'},
   {q:'Perkataan manakah terbentuk daripada MA + TA?',options:['mata','madu','masa'],a:0,why:'MA + TA membentuk mata.'},
   {q:'Pilih perkataan yang dieja dengan betul.',options:['bolah','bola','bula'],a:1,why:'Ejaan yang betul ialah bola.'},
   {q:'Perkataan KAKI mempunyai berapa suku kata?',options:['Satu','Dua','Tiga'],a:1,why:'KA + KI ialah dua suku kata.'},
   {q:'Pilih gabungan suku kata untuk perkataan SUSU.',options:['SU + SU','SA + SU','SU + SI'],a:0,why:'SU + SU membentuk susu.'}
  ],
  2:[
   {q:'Pilih ayat yang mempunyai susunan perkataan yang betul.',options:['Bola Ali bermain.','Ali bermain bola.','Bermain Ali bola.'],a:1,why:'Ayat yang betul ialah Ali bermain bola.'},
   {q:'Baca ayat ini: “Ibu memasak nasi.” Siapakah yang memasak?',options:['Ayah','Ibu','Adik'],a:1,why:'Ibu ialah orang yang memasak.'},
   {q:'Pilih tanda baca yang sesuai: “Di manakah buku saya__”',options:['.','?','!'],a:1,why:'Ayat tanya menggunakan tanda soal.'},
   {q:'Baca ayat: “Kucing itu tidur di atas tikar.” Di manakah kucing tidur?',options:['Di atas tikar','Di dalam kotak','Di bawah meja'],a:0,why:'Kucing tidur di atas tikar.'},
   {q:'Pilih ayat yang menggunakan huruf besar dengan betul.',options:['siti membaca buku.','Siti membaca buku.','Siti Membaca Buku.'],a:1,why:'Nama khas dan awal ayat bermula dengan huruf besar.'}
  ],
  3:[
   {passage:'Pada waktu pagi, Hana menyiram pokok bunga di halaman rumah. Selepas itu, Hana membantu ibunya menyapu lantai. Ibu mengucapkan terima kasih kepada Hana.',q:'Apakah yang dilakukan Hana pada waktu pagi?',options:['Menyiram pokok bunga','Membasuh kereta','Bermain bola'],a:0,why:'Hana menyiram pokok bunga pada waktu pagi.'},
   {passage:'Pada waktu pagi, Hana menyiram pokok bunga di halaman rumah. Selepas itu, Hana membantu ibunya menyapu lantai. Ibu mengucapkan terima kasih kepada Hana.',q:'Siapakah yang dibantu oleh Hana?',options:['Kakak','Ibunya','Rakannya'],a:1,why:'Hana membantu ibunya menyapu lantai.'},
   {passage:'Pada waktu pagi, Hana menyiram pokok bunga di halaman rumah. Selepas itu, Hana membantu ibunya menyapu lantai. Ibu mengucapkan terima kasih kepada Hana.',q:'Mengapakah ibu mengucapkan terima kasih?',options:['Hana membantu ibu','Hana tidur','Hana keluar bermain'],a:0,why:'Ibu berterima kasih kerana Hana membantu kerja rumah.'},
   {passage:'Pada waktu pagi, Hana menyiram pokok bunga di halaman rumah. Selepas itu, Hana membantu ibunya menyapu lantai. Ibu mengucapkan terima kasih kepada Hana.',q:'Pilih urutan peristiwa yang betul.',options:['Menyapu, menyiram, berterima kasih','Menyiram, menyapu, berterima kasih','Berterima kasih, menyapu, menyiram'],a:1,why:'Hana menyiram bunga dahulu, kemudian menyapu lantai.'},
   {passage:'Pada waktu pagi, Hana menyiram pokok bunga di halaman rumah. Selepas itu, Hana membantu ibunya menyapu lantai. Ibu mengucapkan terima kasih kepada Hana.',q:'Apakah nilai baik yang ditunjukkan Hana?',options:['Suka membazir','Suka membantu','Suka mengejek'],a:1,why:'Hana menunjukkan sikap suka membantu.'}
  ]
};
const reinforce={
 1:[{q:'Pilih suku kata bagi perkataan BAJU.',options:['BA + JU','BU + JU','BA + JI'],a:0,why:'BA + JU membentuk baju.'},{q:'Perkataan MAMA mempunyai berapa suku kata?',options:['Dua','Satu','Tiga'],a:0,why:'MA + MA ialah dua suku kata.'},{q:'Pilih ejaan yang betul.',options:['meja','maja','meje'],a:0,why:'Ejaan yang betul ialah meja.'}],
 2:[{q:'Baca: “Adik minum air.” Apakah yang diminum?',options:['Air','Susu','Nasi'],a:0,why:'Adik minum air.'},{q:'Pilih ayat yang betul.',options:['Di taman bermain Amir.','Amir bermain di taman.','Taman Amir di bermain.'],a:1,why:'Ayat yang betul ialah Amir bermain di taman.'},{q:'Tanda baca di akhir ayat penyata ialah...',options:['Titik (.)','Soal (?)','Koma (,)'],a:0,why:'Ayat penyata lazimnya diakhiri tanda titik.'}],
 3:[{passage:'Amin pergi ke perpustakaan. Dia meminjam sebuah buku cerita. Amin membaca buku itu di rumah.',q:'Di manakah Amin meminjam buku?',options:['Di pasar','Di perpustakaan','Di taman'],a:1,why:'Amin meminjam buku di perpustakaan.'},{passage:'Amin pergi ke perpustakaan. Dia meminjam sebuah buku cerita. Amin membaca buku itu di rumah.',q:'Apakah yang dipinjam oleh Amin?',options:['Buku cerita','Bola','Beg'],a:0,why:'Amin meminjam buku cerita.'},{passage:'Amin pergi ke perpustakaan. Dia meminjam sebuah buku cerita. Amin membaca buku itu di rumah.',q:'Di manakah Amin membaca buku?',options:['Di rumah','Di kantin','Di padang'],a:0,why:'Amin membaca buku di rumah.'}]
};
const KEY='bacamaju_v1_history';let session=null;let view='home';let selected=-1;let feedback=false;
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function history(){try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return []}}
function save(record){try{localStorage.setItem(KEY,JSON.stringify([...history(),record]))}catch{alert('Penyimpanan setempat tidak tersedia. Muat turun rekod CSV untuk menyimpan keputusan.')}}
function shell(title,body){$('#app').innerHTML=`<section class="panel"><h2>${title}</h2>${body}</section>`}
function home(){view='home';const n=history().length;shell('Selamat datang!',`<p>Belajar membaca secara berperingkat melalui <strong>suku kata dan perkataan</strong>, <strong>ayat mudah</strong> serta <strong>petikan pendek</strong>. Latihan susulan ditentukan oleh markah kamu.</p><div class="notice"><strong>Nota untuk guru:</strong> Aktiviti ini menilai pengecaman perkataan, struktur ayat dan kefahaman bacaan melalui pilihan jawapan. Ia <strong>belum menilai kelancaran bacaan lisan, kadar atau sebutan</strong>.</div><label for="student">Nama murid atau nama samaran</label><input id="student" maxlength="40" placeholder="Contoh: Murid A" autocomplete="off"><p class="muted small">Gunakan nama samaran untuk menjaga privasi murid. Rekod hanya disimpan dalam pelayar pada peranti ini.</p><div class="nav"><button class="btn" onclick="start()">Mulakan penilaian awal</button><button class="btn secondary" onclick="dashboard()">Rekod kemajuan (${n})</button><button class="btn ghost" onclick="about()">Tentang modul</button></div>`)}
function start(){const name=$('#student').value.trim()||'Murid A';session={name,level:1,phase:'utama',i:0,correct:0,answers:[],rounds:[],started:new Date().toISOString()};selected=-1;feedback=false;question()}
function activeBank(){return session.phase==='utama'?bank[session.level]:reinforce[session.level]}
function question(){view='question';let qs=activeBank(),x=qs[session.i];if(!x){endRound();return}const percent=Math.round(session.i/qs.length*100);shell(`Tahap ${session.level} · ${session.phase==='utama'?'Latihan utama':'Latihan pengukuhan'}`,`<p class="muted">${esc(session.name)} • Soalan ${session.i+1} daripada ${qs.length}</p><div class="progress"><div style="width:${percent}%"></div></div>${x.passage?`<div class="prompt passage">${esc(x.passage)}</div>`:''}<div class="prompt"><div class="word">${esc(x.q)}</div></div><div class="choices">${x.options.map((o,i)=>`<button class="choice" id="opt${i}" onclick="pick(${i})" aria-pressed="false">${esc(o)}</button>`).join('')}</div><div id="message"></div><div class="nav"><button id="check" class="btn" onclick="check()" disabled>Semak jawapan</button><button class="btn ghost" onclick="home()">Keluar ke menu</button></div>`)}
function pick(i){if(feedback)return;selected=i;document.querySelectorAll('.choice').forEach((e,j)=>{e.classList.toggle('selected',i===j);e.setAttribute('aria-pressed',String(i===j))});$('#check').disabled=false}
function check(){if(selected<0)return;const x=activeBank()[session.i];if(!feedback){feedback=true;let ok=selected===x.a;if(ok)session.correct++;session.answers.push({level:session.level,phase:session.phase,q:x.q,chosen:x.options[selected],correct:x.options[x.a],ok});$('#message').innerHTML=`<div class="${ok?'success':'error'}"><strong>${ok?'Bagus, jawapan betul!':'Belum tepat. Teruskan mencuba!'}</strong><p>${esc(x.why)}</p><span class="small">Nilai VBE: ${ok?'ketelitian':'kesabaran dan ketekunan'}.</span></div>`;$('#check').textContent='Soalan seterusnya';document.querySelectorAll('.choice').forEach(e=>e.disabled=true)}else{session.i++;selected=-1;feedback=false;question()}}
function endRound(){let total=activeBank().length,score=session.correct,rate=Math.round(score/total*100);session.rounds.push({level:session.level,phase:session.phase,score,total,rate});const level=session.level,phase=session.phase;let message='',button='';if(phase==='utama'&&rate<80){message=`Skor ${rate}%. Kamu akan mendapat <strong>latihan pengukuhan Tahap ${level}</strong> kerana skor belum mencapai 80%.`;button='<button class="btn" onclick="nextRound(\'pengukuhan\')">Mulakan pengukuhan</button>'}else if(phase==='pengukuhan'&&rate<80){message=`Skor ${rate}%. Kamu telah berusaha! Tahap ini belum dikuasai berdasarkan kriteria prototaip. Sila ulang latihan dengan bimbingan guru.`;button='<button class="btn" onclick="finish()">Lihat rumusan</button>'}else if(level<3){message=`Skor ${rate}%. Tahniah! Kamu boleh meneruskan ke Tahap ${level+1}.`;button='<button class="btn" onclick="nextRound(\'naik\')">Teruskan ke tahap seterusnya</button>'}else{message=`Skor ${rate}%. Kamu telah menyelesaikan semua tahap. Syabas kerana tekun berlatih!`;button='<button class="btn" onclick="finish()">Lihat rumusan</button>'}shell('Keputusan latihan',`<div class="stat"><strong>${score}/${total} · ${rate}%</strong>${phase==='utama'?'Latihan utama':'Latihan pengukuhan'} • Tahap ${level}</div><p>${message}</p><p class="muted">Ambang 80% ialah tetapan demonstrasi modul, bukan piawaian diagnostik yang disahkan.</p><div class="nav">${button}<button class="btn secondary" onclick="finish()">Tamatkan sesi</button></div>`)}
function nextRound(action){if(action==='naik')session.level++;else session.phase='pengukuhan';if(action==='naik')session.phase='utama';session.i=0;session.correct=0;selected=-1;feedback=false;question()}
function finish(){if(!session)return;let r={name:session.name,started:session.started,ended:new Date().toISOString(),rounds:session.rounds,answers:session.answers};save(r);session=null;view='finished';shell('Rumusan sesi disimpan',`<div class="success">Rekod sesi telah disimpan secara setempat dalam pelayar ini (jika penyimpanan dibenarkan).</div><p>Terima kasih kerana berlatih. Teruskan membaca dengan sabar, tekun dan teliti.</p><div class="nav"><button class="btn" onclick="dashboard()">Lihat rekod kemajuan</button><button class="btn secondary" onclick="home()">Menu utama</button></div>`)}
function dashboard(){view='dashboard';const list=history();const rows=list.map((r,i)=>{const last=r.rounds?.at(-1);return `<tr><td>${esc(r.name)}</td><td>${new Date(r.ended).toLocaleString('ms-MY')}</td><td>${r.rounds?.length||0}</td><td>${last?`Tahap ${last.level} (${last.rate}%)`:'Tiada'}</td><td><button class="btn secondary" onclick="detail(${i})">Butiran</button></td></tr>`}).join('');shell('Rekod kemajuan',`<p class="muted">Rekod disimpan pada peranti dan pelayar ini sahaja. Ia tidak diselaraskan antara peranti.</p>${list.length?`<div class="tablewrap"><table><thead><tr><th>Murid</th><th>Tarikh</th><th>Pusingan</th><th>Keputusan akhir</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p>Belum ada rekod sesi.</p>'}<div class="nav"><button class="btn" onclick="home()">Menu utama</button><button class="btn secondary" onclick="csv()" ${list.length?'':'disabled'}>Eksport CSV</button><button class="btn danger" onclick="clearHistory()" ${list.length?'':'disabled'}>Padam semua rekod</button></div>`)}
function detail(i){const r=history()[i];if(!r)return dashboard();shell(`Butiran: ${esc(r.name)}`,`<p class="muted">${new Date(r.ended).toLocaleString('ms-MY')}</p><h3>Keputusan setiap pusingan</h3><div class="tablewrap"><table><thead><tr><th>Tahap</th><th>Jenis</th><th>Betul</th><th>Skor</th></tr></thead><tbody>${r.rounds.map(x=>`<tr><td>${x.level}</td><td>${x.phase==='utama'?'Utama':'Pengukuhan'}</td><td>${x.score}/${x.total}</td><td>${x.rate}%</td></tr>`).join('')}</tbody></table></div><h3>Jawapan yang perlu disemak</h3>${r.answers.filter(x=>!x.ok).length?`<ul>${r.answers.filter(x=>!x.ok).map(x=>`<li>${esc(x.q)}<br><span class="muted">Jawapan dipilih: ${esc(x.chosen)}; jawapan betul: ${esc(x.correct)}</span></li>`).join('')}</ul>`:'<p>Semua soalan yang dijawab adalah betul.</p>'}<div class="nav"><button class="btn secondary" onclick="dashboard()">Kembali</button></div>`)}
function csv(){const list=history();let rows=[['Nama samaran','Tarikh tamat','Tahap','Jenis latihan','Betul','Jumlah soalan','Peratus']];for(const r of list)for(const x of r.rounds)rows.push([r.name,r.ended,x.level,x.phase,x.score,x.total,x.rate]);let str='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([str],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='Rekod_BacaMaju_AI.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function clearHistory(){if(confirm('Padam semua rekod pada pelayar ini? Tindakan ini tidak boleh dibatalkan.')){localStorage.removeItem(KEY);dashboard()}}
function about(){shell('Tentang BacaMaju AI',`<p><strong>Tujuan:</strong> Prototaip modul digital untuk latihan pengecaman suku kata, struktur ayat dan kefahaman bacaan bahasa Melayu.</p><h3>Bagaimana latihan adaptif berfungsi?</h3><p>Setiap tahap mempunyai lima soalan. Skor 80% atau lebih membolehkan murid naik tahap. Skor kurang 80% membawa murid kepada tiga soalan pengukuhan. Jika masih kurang 80%, sesi tamat dengan saranan bimbingan guru. Ambang ini ialah keputusan reka bentuk prototaip, bukan penilaian klinikal atau piawaian rasmi.</p><h3>Peranan AI</h3><p>AI membantu merancang struktur modul, menghasilkan draf latihan dan kod aplikasi. Kandungan perlu disemak oleh penyedia dan guru sebelum digunakan dengan murid sebenar. <strong>Tiada model AI berjalan secara langsung dalam modul ini.</strong> Logik penyesuaian ialah peraturan markah yang diprogramkan.</p><h3>Had</h3><p>Tiada pengecaman suara, rakaman mikrofon atau penilaian sebutan. Latihan ini tidak boleh membuktikan peningkatan kelancaran membaca lisan tanpa penilaian tambahan. Maklumat murid disimpan setempat sahaja dan tidak dihantar ke pelayan.</p><h3>Nilai VBE</h3><p>Kesabaran ketika mencuba semula; ketekunan melalui latihan berulang; ketelitian ketika memilih jawapan; empati melalui aktiviti rakan sebaya yang dibimbing guru (di luar modul).</p><div class="nav"><button class="btn secondary" onclick="home()">Kembali ke menu</button></div>`)}
home();
</script></body></html>
